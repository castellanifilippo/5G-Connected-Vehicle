[General]
network = Network_5G
cpu-time-limit = 60s
**.highway-length = 10000
**.BS-number = 11
**.BS-road-offset = 20 #distance from the road to the base station
**.propagation.alpha = 0.00000004 #proportionality constant for the propagation model
**.vehicle.speed = 25.0
**.vehicle.idBS = 0 #default value for the base station ID
**.vehicle.handover-interval = 0.01s #handover packets interval


#debug-on-errors = true


