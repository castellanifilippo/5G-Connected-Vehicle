[General]
network = Network_5G
cpu-time-limit = 60s
**.L = 10000m #highway length
**.N = 11 #number of base stations
**.BSRoadOffset = 20m #distance from the road to the base station
**.alpha = 0.00000004 #proportionality constant for the propagation model
**.vehicle.mobilitySystem.speed = 25.0mps #default value for the vehicle speed
**.vehicle.mobilitySystem.idBS = 0 #default value for the base station ID
**.vehicle.handoverSystem.H = 0.01s #handover packets interval
**.bs[*].delay = 0.001s #delay for sending handover response to the vehicle


#debug-on-errors = true


